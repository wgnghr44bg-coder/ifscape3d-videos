<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000}canvas{display:block}</style></head>
<body>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeCoatSet, makeEmptyCar, makeWoman, poseWoman } from './props.js';
const W = 720, H = 1280;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x7fa6cf); scene.fog = new THREE.Fog(0xd6e2ea, 40, 260);
const camera = new THREE.PerspectiveCamera(60, W / H, .05, 2000);
const lam = (color, o = {}) => new THREE.MeshLambertMaterial({ color, flatShading: true, ...o });
const shadowed = (m, cast = true) => { m.castShadow = cast; m.receiveShadow = true; return m; };
const ctx = { THREE, lam, shadowed };
scene.add(new THREE.HemisphereLight(0xe3ecf4, 0x5a5448, 1.5));
const sun = new THREE.DirectionalLight(0xffeedd, 2.4); sun.position.set(-30, 50, 40); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); sun.shadow.bias = -.0005;
scene.add(sun);
// street like scene.html: road at y 0, pavement box top at y 0.2 (x from 10 to 16), facades behind
const road = shadowed(new THREE.Mesh(new THREE.PlaneGeometry(200, 200), lam(0x3c3e41)), false); road.rotation.x = -Math.PI / 2; scene.add(road);
const walk = shadowed(new THREE.Mesh(new THREE.BoxGeometry(6, .2, 200), lam(0x9b968c)), false); walk.position.set(13, .1, 0); scene.add(walk);
const curb = shadowed(new THREE.Mesh(new THREE.BoxGeometry(.3, .22, 200), lam(0xb7b2a8)), false); curb.position.set(10, .11, 0); scene.add(curb);
for (let z = -60; z < 60; z += 14) { const h = 12 + (Math.abs(z * 7) % 13); const b = shadowed(new THREE.Mesh(new THREE.BoxGeometry(10, h, 13.6), lam([0x9c4a3a, 0xc9b896, 0x7a5a44, 0xd2c6ae][(z / 14 + 9) % 4 | 0])));
  b.position.set(21, h / 2, z); scene.add(b); }
for (let x = -9; x <= 9; x += 1.6) { const s = new THREE.Mesh(new THREE.PlaneGeometry(.85, 4), lam(0xd9d6cc)); s.rotation.x = -Math.PI / 2; s.position.set(x, .02, 4); s.receiveShadow = true; scene.add(s); }
const line = new THREE.Mesh(new THREE.PlaneGeometry(.15, 200), lam(0xc9a94a)); line.rotation.x = -Math.PI / 2; line.position.set(0, .02, 0); scene.add(line);

// A: coat set on the pavement (top of the pavement box = 0.2)
const coatA = makeCoatSet(ctx, { color: 0x3e5873, seed: 3 }); coatA.position.set(12.5, .2, 0); scene.add(coatA);
// B: empty car rolling on the road
const car = makeEmptyCar(ctx, 0x8c3b33); car.g.position.set(4.2, .75, 30); scene.add(car.g);
// C: women at the zebra crossing (road, y = 0) with coats
const coats = [[-.3, 3.5, 0x7b4a42], [.75, 4.3, 0x5e6f80], [1.25, 2.9, 0x56624a]];
coats.forEach(([x, z, c], i) => { const s = makeCoatSet(ctx, { color: c, seed: i + 7, phone: i === 1 }); s.position.set(x, 0, z); s.rotation.y = i * 1.3; scene.add(s); });
const kneel = makeWoman(ctx, { shirt: 0xb9ae96, hair: 0x2b1d16 }); kneel.g.position.set(-1.0, 0, 3.5); kneel.g.rotation.y = Math.PI / 2; poseWoman(kneel, 'kneel'); scene.add(kneel.g);
const h1 = makeWoman(ctx, { shirt: 0x9a8a5c, hair: 0x5a3a22 }), h2 = makeWoman(ctx, { shirt: 0x3d4650, hair: 0x1f1a17, skirt: 0x4a3b33 });
h1.g.position.set(.5, 0, 2.3); h1.g.rotation.y = Math.PI / 2; h2.g.position.set(.92, 0, 2.3); h2.g.rotation.y = -Math.PI / 2;
poseWoman(h1, 'hug'); poseWoman(h2, 'hug'); scene.add(h1.g, h2.g);
const pick = makeWoman(ctx, { shirt: 0x8a6b4e, hair: 0x6b4a2a }); pick.g.position.set(1.95, 0, 2.9); pick.g.rotation.y = -Math.PI / 2; poseWoman(pick, 'pickup'); scene.add(pick.g);

const VIEWS = {
  coat: { pos: [11.55, .78, 1.15], look: [12.4, .2, 0.05], fov: 55 },
  car:  { pos: [8.6, 1.05, 34.2], look: [4.2, .75, 30.4], fov: 42 },
  women:{ pos: [.45, 1.8, -5.6], look: [.45, .6, 3.0], fov: 40 },
};
window.view = (k) => { const v = VIEWS[k]; camera.fov = v.fov; camera.updateProjectionMatrix();
  camera.position.set(...v.pos); camera.lookAt(...v.look);
  sun.target.position.set(...v.look); sun.position.set(v.look[0] - 30, 50, v.look[2] + 40); scene.add(sun.target);
  renderer.render(scene, camera); };
window.ready = true;
</script></body></html>
